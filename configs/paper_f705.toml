[account]
starting_cash = 10000.0

[paper]
poll_seconds = 5
overlap_seconds = 900
stale_signal_seconds = 300
# Polymarket taker fee = shares * fee_rate * p * (1-p).
# Crypto markets currently use 0.07 (check the official fee table for other categories).
fee_rate = 0.07
extra_slippage = 0.0
min_fill_ratio = 0.5
max_buy_drift = 0.03
max_sell_drift = 0.1
max_buy_drift_pct = 0.1
max_sell_drift_pct = 0.15
settle_every_seconds = 300
mark_every_seconds = 300
mark_limit = 100
max_pages = 3
page_limit = 500
cash_reserve_pct = 0.05
min_shares = 1.0
request_timeout = 20
request_retries = 4
db_path = "data/paper_f705.db"
log_path = "data/paper_f705.log"

# f705 — full price-range mirror experiment (no buy-price filter).
[targets.f705]
address = "0xf705fa045201391d9632b7f3cde06a5e24453ca7"
enabled = true
sizing_mode = "scale"
scale_factor = 0.01
fixed_notional_usd = 10.0
min_notional_usd = 2.0
max_notional_usd = 100.0
buy_price_min = 0.0
buy_price_max = 1.0
min_target_usd = 0.0
max_target_usd = 1000000000000.0
copy_sells = true
initial_lookback_seconds = 300
max_market_usd = 500.0
max_open_positions = 300
exclude_event_substrings = []
exclude_slug_substrings = []
