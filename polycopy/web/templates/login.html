<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - PolyCopy</title>
<link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">PolyCopy</div>
    <div class="login-sub">纸盘跟单控制台</div>

    {% if error %}<div class="alert warn">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="login-field">用户名
        <input name="username" value="admin" autocomplete="username" required>
      </label>
      <label class="login-field">密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary login-btn" type="submit">登录</button>
    </form>
    <div class="login-foot muted">仅限管理员访问 · 登录状态保留 7 天</div>
  </div>
</div>
</body>
</html>
